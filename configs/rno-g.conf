##
release="12.5"
image_type="rno-g"
##
##Debootstrap: https://wiki.debian.org/Debootstrap
##
##debootstrap --arch=${deb_arch} --include=${deb_include} --exclude=${deb_exclude} \
##--components=${deb_components} --foreign ${deb_codename} /tmp/tmp.dir/ http://${deb_mirror}
##
deb_distribution="debian"
deb_codename="bookworm"
deb_arch="armhf"
#
deb_include="	\
	at	\
	automake	\
	bash-completion	\
	bc	\
	bmon \
	build-essential	\
	binutils \
	ca-certificates	\
	can-utils	\
	chrony          \
	cpufrequtils	\
	curl	\
	device-tree-compiler	\
	dosfstools	\
	fake-hwclock	\
	libfftw3-dev \
	liblz4-dev \
	git	\
	gnupg	\
  gpiod \
	gpsd	\
	gpsd-tools	\
	libgsl-dev \
	hdparm	\
	hexedit	\
	hostapd	\
	htop	\
	i2c-tools	\
	initramfs-tools	\
	ifupdown	\
	iperf3	\
	iw	\
	less	\
	libconfig-dev \
	libcurl4-openssl-dev	\
	libiio-utils	\
	libinline-files-perl	\
	libncurses5-dev	\
	libnss-mdns	\
	libnss-systemd	\
	libtool	\
	libdbus-1-dev	\
	libpci-dev \
	libsystemd-dev \
	libusb-1.0-0-dev	\
	linux-base	\
	linux-perf	\
	linux-cpupower	\
	locales	\
	lshw	\
	lsof	\
	lz4 \
	lzma	\
	lzop	\
	mmc-utils	\
	memtester	\
	minicom	\
	nano	\
	netcat-openbsd	\
	nethogs	\
	openssh-server	\
	overlayroot     \
	pkg-config	\
	ppp \
	pps-tools	\
	python-is-python3 \
	python3	\
	python3-dev	\
	python3-intelhex \
	python3-gps	\
	python3-libgpiod	\
	python3-numpy	\
	python3-dbus	\
	python3-pip	\
	python3-scipy	\
	python3-sdnotify	\
	python3-serial	\
	python3-setuptools	\
	python3-smbus	\
	python3-usb	\
	reptyr \
	rfkill	\
	rsync	\
	screen	\
	ssh-import-id \
	ssl-cert	\
	strace	\
	sudo	\
	systemd	\
	telnet	\
	tig	\
	tio	\
	traceroute \
	tmux	\
	u-boot-tools	\
	unzip \
	usbutils	\
	valgrind \
	vim	\
	wget \
	zile \
	zlib1g-dev \
"

#
deb_exclude=""
#
deb_components="main contrib non-free"
deb_mirror=""
##
##Some packages fail to install via debootstrap: deb_additional_pkgs="<comma|space>"
##
deb_additional_pkgs="	\
	net-tools \
	libpam-systemd	\
	avahi-utils	\
	gdb	\
	gpsd-clients    \
	man-db	\
	manpages	\
	manpages-dev	\
"

##
rfs_username="rno-g"
rfs_fullname="RNO-G"
rfs_password="#PLACEHOLDER_PASSWORD#"
rfs_hostname="rno-g"
rfs_root_password="#PLACEHOLDER_PASSWORD#"
#rfs_startup_scripts="enable"
rfs_opt_scripts="https://github.com/rno-g/bbb-boot-scripts"
rfs_default_desktop=""
rfs_desktop_background=""
rfs_default_locale="en_US.UTF-8"
rfs_etc_dogtag="RNO-G Debian Image Bookworm"
rfs_console_banner="This system is for authorized RNO-G members only. Your commands may be monitored. \n\nEven if you are an RNO-G member, only log in to this system if you understand how it works. If in doubt, contact an expert."
rfs_console_user_pass=""
rfs_ssh_banner="This system is for authorized RNO-G members only. Your commands may be monitored. \n\nEven if you are an RNO-G member, only log in to this system if you understand how it works. If in doubt, contact an expert."
rfs_ssh_user_pass=""
rfs_use_systemdnetworkd="enable"
rfs_use_systemdresolved="enable"
python3_pkgs="libconf"
##
##enable kernel repo: http://repos.rcn-ee.com/(debian|ubuntu)
repo_rcnee="enable"
repo_rcnee_pkg_list="	\
	bbb.io-kernel-5.10-ti-am335x\
	bb-customizations	\
	bb-usb-gadgets          \
	generic-sys-mods  \
 	libusbgx\
	moreutils	\
	wireguard-tools	\
	bb-u-boot-am335x-evm	\
	cockpit-packagekit	\
	cockpit-system	\
	cockpit-ws	\
"
repo_rcnee_kernel=5.10.168-ti-r77
repo_rcnee_pkg_version=5.10.168-ti-r77


include_firmware="enable"
#
chroot_COPY_SETUP_SDCARD="enable"
chroot_custom_setup_sdcard=""
chroot_before_hook=""
chroot_after_hook=""
chroot_script="rno-g.sh"
chroot_post_uenv_txt="rno-g-uEnv.txt"
chroot_tarball="disable"
keep_ssh_keys="enable"


